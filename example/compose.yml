x-podman:
  in_pod: false
services:
  dev:
    image: registry.lab.wangup.org/kilin/devel:0.17-cuda13.1.1
    container_name: ripper-pod 
    hostname: ripper-pod
    init: true
    userns_mode: "keep-id"
    working_dir: "${HOME}"
    shm_size: '32g'
    group_add:
      - keep-groups
    
    ports:
      - "12345:22"

    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TERM=xterm-kitty

    volumes:
      - ${HOME}:${HOME}                     # User home
      - /home/NAS/homes/:/home/NAS/homes    # NAS homes 
      - /home/NAS/house/:/home/NAS/house    # NAS house 
      - /home/NAS/data/:/home/NAS/data      # NAS data 
      - ${HOME}/.cache/uv:/opt/uv-cache     # UV cache
      - ${HOME}/.ssh/container-keys:/etc/ssh/host_keys #
      - /var/lib/sss/pipes:/var/lib/sss/pipes
      - /var/lib/sss/mc:/var/lib/sss/mc:ro

    command: ["sleep", "infinity"] 
    devices:
      - nvidia.com/gpu=all
