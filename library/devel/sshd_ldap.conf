# Add to /etc/ssh/sshd_config to fetch SSH public keys from LDAP via SSSD.
# After editing: sudo systemctl restart sshd

AuthorizedKeysCommand /usr/bin/sss_ssh_authorizedkeys %u
# 'nobody' is blocked by Ubuntu's sshd AppArmor profile from accessing SSSD sockets.
# 'root' works and is safe here — sss_ssh_authorizedkeys only reads public keys.
AuthorizedKeysCommandUser root
PasswordAuthentication no

